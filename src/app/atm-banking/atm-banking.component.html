
<div class="atm-card w-auto h-screen bg-amber-600 p-20">
    <h2 class="text-3xl font-serif">Welcome, {{ accountHolder }}</h2>
    <p class="font-thin">Current Balance: <strong>{{ balance }}</strong></p>

    <button class="border p-2 rounded-4xl "
        [disabled] = "balance < 20 || isAccountLocked"
        (click) = "withdrawCash()"> Withdraw $20 
    </button>

    <hr/>
    <button (click)="toggleLock()">
        {{ isAccountLocked ? 'Unlock Account' : 'Lock Account' }}
    </button>
</div>
